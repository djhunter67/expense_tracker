[package]
name = "expense_tracker"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "expense_tracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
colored = "2.1.0"
config = { version = "0.15.4", features = ["yaml"] }
dotenv = "0.15.0"
mongodb = { version = "3.1.0", features = ["sync"] }
serde = { version = "1.0.214", features = ["derive"] }
shlex = "1.3.0"
